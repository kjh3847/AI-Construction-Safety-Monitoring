services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: safety
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety -d safety"]
      interval: 5s
      timeout: 3s
      retries: 10
  accounts:
    build:
      context: .
      dockerfile: deploy/Dockerfile.accounts
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  account_data:
