# HTTPS must terminate at an ALB or this server. Replace server_name.
# Account-only deployment: dashboard video routes are not available here.
server {
    listen 80;
    server_name your-domain.example;
    root /var/www/safety;
    index index.html;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
