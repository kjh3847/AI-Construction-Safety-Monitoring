name: safety-exhibition-qr-s3
services:
  monitor:
    build:
      context: .
      dockerfile: deploy/Dockerfile.monitor
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      EXHIBITION_ENABLED: 'true'
      EXHIBITION_INTERACTIVE: 'true'
      EXHIBITION_VIDEO_DIR: /exhibition-videos
      MEDIA_ENABLED: 'true'
      MEDIA_RTSP_URL: rtsp://relay:8554
      MEDIA_API_URL: http://relay:9997
      MEDIA_WEBRTC_URL: http://relay:8889
      MEDIA_AI_USER: exhibition_gateway
      MEDIA_WEB_USER: exhibition_gateway
      MEDIA_CONTROL_USER: exhibition_gateway
      MEDIA_AI_PASSWORD: ${EXHIBITION_RELAY_KEY:?Set EXHIBITION_RELAY_KEY}
      MEDIA_WEB_PASSWORD: ${EXHIBITION_RELAY_KEY:?Set EXHIBITION_RELAY_KEY}
      MEDIA_CONTROL_PASSWORD: ${EXHIBITION_RELAY_KEY:?Set EXHIBITION_RELAY_KEY}
      CAMERA_RECONNECT_INTERVAL: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      INFERENCE_SIZE: ${EXHIBITION_INFERENCE_SIZE:-512}
      EXHIBITION_OPERATOR_KEY: ${EXHIBITION_OPERATOR_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL to the HTTPS origin}
      MONITOR_AUTOSTART: 'true'
      MODEL_PATH: /models/best.pt
      SAFETY_DB_PATH: /data/safety.db
      MONITOR_STORAGE_DIR: /data/recordings
      RECORDING_MAX_BYTES_PER_CAMERA: 268435456
      CAPTURE_MAX_WIDTH: 960
      ANALYSIS_FPS: ${EXHIBITION_ANALYSIS_FPS:-5}
    volumes:
      - exhibition_data:/data
      - ./exhibition-videos:/exhibition-videos:ro
      - ${EXHIBITION_MODEL_FILE:?Set EXHIBITION_MODEL_FILE}:/models/best.pt:ro
    depends_on:
      - relay
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  relay:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${EXHIBITION_RELAY_KEY:?Set EXHIBITION_RELAY_KEY}
      MTX_WEBRTCADDITIONALHOSTS: ${EXHIBITION_STREAM_HOST:?Set EXHIBITION_STREAM_HOST}
    volumes:
      - ./deploy/mediamtx.exhibition.yml:/mediamtx.yml:ro
    ports:
      - '8190:8190/udp'
      - '8190:8190/tcp'
    logging: *logging
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        WEB_BASE_PATH: /exhibition/
    restart: unless-stopped
    ports:
      - '127.0.0.1:8082:80'
    depends_on:
      monitor:
        condition: service_healthy
    logging: *logging

volumes:
  exhibition_data:
